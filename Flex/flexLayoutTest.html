<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 영역</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        
        #sportsBoxArea{
            background-color: aliceblue;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sportsTeam{
            display: flex;
        }
        .Team{
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img{
            width: 100%;
        }
        
    </style>
</head>
<body>
    <!-- 스포츠 박스 구역 -->
    <div id="sportsBoxArea">

        <!-- 스포츠 메뉴 구역 -->
        <div class="sportsMenu">
            <button class="sports">축구</button>
            <button class="sports">야구</button>
            <button class="sports">E스포츠</button>
            <button class="sports">스페셜</button>
        </div>

        <!-- 스포츠 팀 박스 영역 -->
        <div class="sportsTeam">
            <div class="Team">
                <img src="Gangwon.png" alt="">
                <p>강원FC</p>
            </div>
            <div class="Team">
                <img src="Gangwon.png" alt="">
                <p>강원FC</p>
            </div>

        </div>


    </div>
</body>
</html>
