<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 로그인박스</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .Loginbox{
            width: 380px;
            background-color: #fff;
            text-align: center;
            padding: 21px 20px 18px;
            border-radius: 8px;
            box-shadow: 4px 4px 4px 4px gray;
            margin: 150px;
            
        }
        .Loginbox p{
            font-size: 14.7px;
            color: #2e2e2e;
        }
        .login_btn{
            width: 100%;
            height: 56px;
            background-color:#03A94D;
            margin: 13px 0px 0px;
            padding: 17px 0px;
            border: none;
            cursor: pointer;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .login_btn span{
            font-weight: bold;
            font-size: 24px;
        }
        a{
            text-decoration: none;
            color: #333;
        }
        .menu{
            font-size: 13px;
            margin : 15px ;
        }

    </style>
</head>
<body>
    <div class="Loginbox">
        <p>네이버를 더 안전하고 편리하게 이용하세요</p>
        <button class="login_btn"><span>Naver</span> 로그인</button>
        <div class="menu">
            <a href="#">아이디 찾기</a>
            |
            <a href="#">비밀번호 찾기</a>
            |
            <a href="#">회원가입</a>
        </div>
    </div>

</body>
</html>
