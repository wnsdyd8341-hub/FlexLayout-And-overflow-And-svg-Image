<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--  font awesome 가져오는곳 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>바디워시</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .bodywashbox{
            padding: 10px;
            background-color: #fff;
            width: 300px;
            height: 600px;
            margin: 10px auto;   
        }
        .firstbox{
            width: 100%;
        
            text-align: center;
        }
        .bodywashbox img{
            width: 100%;
            border-radius: 10px;
        }
        .cart{
            width:100%;
            height: 45px;
            /* box-shadow: 2px 2px gray; */
            border-radius: 10px 10px 10px 10px;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: none;
            border: 1px solid rgb(188, 188, 188);
        }
        .fa-cart-shopping{
            font-size: 20px;
        }
        p{
            margin:6px 5px;    
        }
        .price{
            text-decoration: line-through;
            color: grey;
            font-size: 15px;
        }
        span{
            color: red;
    
        }
        .price2{
            display: flex;
            gap: 10px;
            font-weight: bold;
        }
        .review{
            text-decoration: none;
            color: grey;
        }
    </style>
</head>
<body>
    <div class="bodywashbox">
        <div class="firstbox">
            <img src="bodywash.jpg" alt="바디워시">
            <button class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
                담기
            </button>
        </div>
        <div class="secondbox">
            <p class = "text">[말콤] 퍼퓸 모이스트빌 바디워시 1000ml 2종(택1)</p>
            <p class = "price">32,000원</p>
            <p class="price2"><span>59%</span> 12,900원</p>
            <a href="https://www.kurly.com/goods/1001471843" class="review">
                <i class="fa-regular fa-message"></i>
                9,999+</a>
        </div>
    </div>



</body>
</html>
